server {
    listen 8080;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # SPA fallback: cualquier ruta que no sea un archivo real sirve index.html
    # Necesario porque Angular maneja el routing en el navegador
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    # Reverse proxy: reenvía /api/ al backend en la red interna Docker
    # En EC2 reemplazar "backend" por la IP privada de la instancia backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
